<style>
:root{--bg:#EDF1EA;--s1:#F5F7F3;--s2:#FFFFFF;--tx:#1E2A1B;--tx2:#5C6B57;--bd:#D3DCCD;--bd2:#A9B8A2}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Barlow','Segoe UI',system-ui,sans-serif;font-size:15px;line-height:1.45}
#app{max-width:1000px;margin:0 auto;padding:16px 16px 70px}
h3{margin:0 0 10px;font-size:15px;font-weight:600;display:flex;align-items:center;gap:6px}
input,select,textarea{font:inherit;color:var(--tx);border:2px solid #3B6D11;border-radius:10px;background:#fff;padding:8px 10px;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:#27500A;box-shadow:0 0 0 3px #C0DD97}
input.auto{background:#E6F1FB;border-color:#185FA5;color:#0C447C}
button{font:inherit;cursor:pointer;border:2px solid #3B6D11;background:#EAF3DE;color:#27500A;border-radius:10px;font-weight:600;padding:8px 14px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
button:hover{background:#3B6D11;color:#fff}
button:focus-visible,.cc:focus-visible,.fecha:focus-visible{outline:3px solid #185FA5;outline-offset:2px}
button.go{background:#3B6D11;color:#fff;width:100%;margin-top:12px;padding:11px}
button.go:hover{background:#27500A}
button.ob{border-color:#993C1D;background:#fff;color:#712B13}
button.ob:hover{background:#993C1D;color:#fff}
button.danger{border-color:#A32D2D;background:#FCEBEB;color:#791F1F}
button.danger:hover{background:#A32D2D;color:#fff}
button.sm{padding:4px 10px;font-size:13px}
.cc{background:var(--t);color:var(--tt);border:3px solid var(--c);border-radius:12px;cursor:pointer;transition:background .15s,color .15s;position:relative}
.cc:hover,.cc.sel{background:var(--c);color:#fff}
.cc:hover *,.cc.sel *{color:#fff!important}
.bdg{position:absolute;top:-8px;right:-8px;background:#993C1D;color:#fff!important;border:2px solid #fff;border-radius:999px;font-size:11px;font-weight:600;min-width:22px;height:22px;display:flex;align-items:center;justify-content:center;padding:0 5px}
.cd{background:var(--s2);border:1px solid var(--bd);border-radius:14px;padding:1rem 1.1rem;margin-bottom:12px}
.lb{font-size:12px;color:var(--tx2);display:block;margin-bottom:4px}
.hint{font-size:13px;color:#3B6D11;margin-top:6px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:12px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.pill{font-size:11px;padding:3px 10px;border-radius:999px;white-space:nowrap;font-weight:600}
.ok{background:#EAF3DE;color:#27500A}.pe{background:#FAEEDA;color:#633806}.pa{background:#E6F1FB;color:#0C447C}
.kp{border-radius:12px;padding:.6rem .8rem;border:2px solid;position:relative}
.kp i{font-size:18px}.kp .v{font-size:19px;font-weight:600;display:block}.kp .l{font-size:12px}
.pc{position:absolute;top:6px;right:6px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;color:#fff}
.big{padding:.9rem 1rem;display:flex;align-items:center;gap:12px}
.big i{font-size:28px}.big b{font-size:16px;font-weight:600;display:block}.big span{font-size:13px}
.nav{padding:7px;display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;justify-content:center}.nav i{font-size:17px}
.sec{border:1px solid var(--bd);border-radius:14px;padding:.8rem;margin-bottom:12px;background:var(--s1)}
.sec h3{font-size:15px}
.st{padding:.6rem .7rem;display:flex;align-items:center;gap:8px}
.st i{font-size:21px}.st b{font-size:14px;font-weight:600;display:block}.st span{font-size:12px}
.tk{display:flex;gap:8px;flex-wrap:wrap}.tk span{padding:6px 16px;font-size:14px;font-weight:600}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--bd);font-size:14px}
.mr{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;border:2px solid;border-radius:10px;margin-top:8px;font-size:14px}
.tl{text-align:center;font-size:13px;font-weight:600;margin-bottom:4px}
.tb{border:3px solid;border-radius:12px;padding:.7rem .5rem;text-align:center}
.tb{min-height:88px}.tb .k{font-size:19px;font-weight:600;display:block;line-height:1.25}.tb .s{font-size:12px}.tb .x{font-size:12px;font-weight:600;display:block;line-height:1.5}
.totl{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px;padding:8px 12px;border:2px solid #3B6D11;border-radius:10px;background:#EAF3DE;color:#27500A;font-weight:600;font-size:14px}
button.fin{border-color:#A32D2D;background:#A32D2D;color:#fff;padding:4px 12px;font-size:13px}
button.fin:hover{background:#791F1F}
button.wa{border-color:#0F6E56;background:#E1F5EE;color:#085041;width:100%;justify-content:space-between;margin-top:8px;padding:10px 14px}
button.wa:hover{background:#0F6E56;color:#fff}
.comp{background:#fff;color:#222;border:1px solid #ccc;border-radius:6px;padding:18px 20px;font-family:Georgia,serif;box-shadow:0 2px 10px rgba(0,0,0,.08);margin-top:10px}
.cerrado{padding:8px 12px;border:2px solid #5F5E5A;background:#F1EFE8;color:#444441;border-radius:10px;font-size:14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.tot{border:3px solid;border-radius:12px;padding:10px 12px;margin-top:12px}
.tot .tg{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-top:8px}
.tot .tg div{background:var(--s2);border-radius:8px;padding:6px 10px;font-size:12px}
.tot .tg b{display:block;font-size:16px;font-weight:600}
.pes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px;padding:12px;border:2px solid #993C1D;border-radius:12px;background:#FAECE7}
.net{border:3px solid #3B6D11;border-radius:10px;background:#EAF3DE;color:#27500A;padding:6px 10px;font-size:19px;font-weight:600;text-align:center}
.cam{padding:12px;border:2px solid #185FA5;border-radius:12px;background:#E6F1FB}
.aviso{padding:10px 12px;border:3px solid #A32D2D;background:#FCEBEB;color:#791F1F;border-radius:12px;margin-bottom:12px;font-size:14px}
.alerta{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 12px;border:3px solid #993C1D;background:#FAECE7;color:#712B13;border-radius:12px;margin-bottom:12px;font-size:15px}
.alerta.nada{border-color:var(--bd2);background:var(--s1);color:var(--tx2)}
.hd{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px;position:relative}
.fecha{cursor:pointer;font-size:14px;padding:6px 14px;border:2px solid #3B6D11;background:#EAF3DE;color:#27500A;border-radius:999px;font-weight:600;white-space:nowrap;margin-left:auto}
.fecha:hover,.fecha.on{background:#3B6D11;color:#fff}
.calw{position:absolute;right:0;top:100%;margin-top:6px;z-index:20;width:236px;border:3px solid #3B6D11;border-radius:12px;padding:8px;background:var(--s2);box-shadow:0 8px 24px rgba(30,42,27,.18)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;font-size:12px}
.cal .d{padding:4px 0;border-radius:6px;cursor:pointer;border:1.5px solid transparent}
.cal .d:hover{border-color:#3B6D11}.cal .d.s{background:#3B6D11;color:#fff}
.cal .d.h{font-weight:600;color:#27500A;background:#EAF3DE}.cal .d.s.h{color:#fff;background:#3B6D11}
.cal .d.hoy{border-color:#854F0B}
.calw button{padding:2px 7px;font-size:12px}
.res{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:6px;margin-top:6px}
.res span{background:var(--s2);border-radius:8px;padding:4px 8px;font-size:13px}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.brand img{height:44px;width:auto}
.brand .t1{font-size:17px;font-weight:600}.brand .t2{font-size:13px;color:var(--tx2)}
.sw{width:46px;height:26px;border-radius:13px;background:#C9D3C4;position:relative;cursor:pointer;flex-shrink:0;border:2px solid #3B6D11}
.sw::after{content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s}
.sw.on{background:#3B6D11}.sw.on::after{left:22px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th,.tbl td{border-bottom:1px solid var(--bd);padding:6px 6px;text-align:right}
.tbl th{color:var(--tx2);font-weight:600}
.tbl td:first-child,.tbl th:first-child{text-align:left}
.scrollx{overflow-x:auto}
.barra{height:8px;border-radius:4px;background:#3B6D11;min-width:2px}
.acc{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.acc button{padding:12px 6px;flex-direction:column;gap:4px}
.acc button i{font-size:22px}
.hoja{background:#fff;color:#222;border:1px solid #ccc;box-shadow:0 2px 10px rgba(0,0,0,.10);border-radius:4px;padding:20px 22px;margin-top:12px;font-size:12px;font-family:Georgia,serif}
.hoja table{width:100%;border-collapse:collapse;margin-top:6px}
.hoja td,.hoja th{border:1px solid #bbb;padding:3px 6px;text-align:right}
.hoja th{background:#EAF3DE;font-weight:600}
.hoja td:first-child,.hoja th:first-child{text-align:left}
.hoja h4{margin:14px 0 2px;font-size:13px;color:#27500A}
.vacio{padding:14px;text-align:center;color:var(--tx2);font-size:14px}
.login{max-width:380px;margin:30px auto}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#27500A;color:#fff;padding:10px 18px;border-radius:12px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.2);display:none;z-index:50;max-width:90%;text-align:center}
#toast.err{background:#A32D2D}
@media (max-width:640px){.g3,.pes,.acc{grid-template-columns:1fr}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g2{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

   ========================================================= */
let D={config:null,turnos:{},paradas:{},despachos:{},muestras:{},ultima:{},personal:{},cierres:{},stockExp:{},remitos:{}};
let S={locked:null,auth:null,view:null,sub:null,sel:null,calOpen:false,vm:null,nm:null,lsel:null,tq:'T1',reset:null,finConf:false,sxMes:null,dirty:false,pend:false,login:null,mesRes:null,mesEst:null,hq:'',htipo:''};

/* =========================================================
   UTILIDADES
   ========================================================= */
const p2=n=>String(n).padStart(2,'0');
function ymd(d){return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());}
function parse(s){const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2]);}
function addDays(s,n){const d=parse(s);d.setDate(d.getDate()+n);return ymd(d);}
function fd(s){const d=parse(s);return DS[d.getDay()]+' '+p2(d.getDate())+'/'+p2(d.getMonth()+1);}
function fdc(s){const d=parse(s);return p2(d.getDate())+'/'+p2(d.getMonth()+1)+'/'+d.getFullYear();}
function hhmm(d){return p2(d.getHours())+':'+p2(d.getMinutes());}
function opNow(){const n=new Date(),h=n.getHours(),f=new Date(n);if(h>=22)f.setDate(f.getDate()+1);return {fecha:ymd(f),turno:(h>=22||h<6)?'noche':(h<14?'manana':'tarde')};}
function turnoDeHora(s){const h=Number((s||'0').split(':')[0]);return (h>=22||h<6)?'noche':(h<14?'manana':'tarde');}
function mesNombre(ym){const a=ym.split('-');return MS[Number(a[1])-1]+' '+a[0];}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1);}
const fmt=n=>Math.round(n||0).toLocaleString('es-AR');
const fdec=n=>n==null?'—':Number(n).toLocaleString('es-AR',{maximumFractionDigits:2});
function pct(a,b){return b?(a/b*100).toLocaleString('es-AR',{minimumFractionDigits:1,maximumFractionDigits:1})+' %':'—';}
function el(id){return document.getElementById(id);}
function val(id){const e=el(id);return e?e.value.trim():'';}
function numIn(id){const e=el(id);if(!e)return null;const v=e.value.replace(/[^\d]/g,'');return v===''?null:Number(v);}
function decIn(id){const e=el(id);if(!e)return null;const v=e.value.trim().replace(',','.');if(v==='')return null;const n=parseFloat(v);return isNaN(n)?null:n;}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function minutos(a,b){if(!a||!b)return 0;const x=a.split(':').map(Number),y=b.split(':').map(Number);let m=(y[0]*60+y[1])-(x[0]*60+x[1]);if(m<0)m+=1440;return m;}
function hm(min){return Math.floor(min/60)+' h '+p2(min%60)+' min';}
let toastT;function toast(msg,err){const t=el('toast');t.textContent=msg;t.className=err?'err':'';t.style.display='block';clearTimeout(toastT);toastT=setTimeout(()=>t.style.display='none',err?4500:2800);}
function errFb(e){console.error(e);toast('No se pudo guardar. Revisá la conexión a internet y volvé a intentar.',1);}
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function lsDel(k){try{localStorage.removeItem(k);}catch(e){}}

function cfg(){return D.config||{};}
function claves(){return Object.assign({},CLAVES_DEF,cfg().claves||{});}
function mermaCfg(){const m=cfg().merma;return m==null?0:(Number(m)||0);}
function balExp(){return !!cfg().balanzaExpeller;}
function personal(){return Object.entries(D.personal||{}).map(([id,p])=>({id,nombre:(p&&p.apellidoNombre)||'',sector:(p&&p.sector)||''})).filter(p=>p.nombre).sort((a,b)=>a.nombre.localeCompare(b.nombre));}
function hoy(){return opNow().fecha;}

/* =========================================================
   CÁLCULOS
   ========================================================= */
function tCalc(t){t=t||{};const soja=(t.soja&&t.soja.kg)||0,ace=(t.aceite&&t.aceite.kg)||0;const m=t.merma!=null?Number(t.merma):mermaCfg();let exp,mer,real=false;
  if(t.expeller&&t.expeller.kg!=null){real=true;exp=t.expeller.kg;mer=soja-ace-exp;}
  else{mer=soja?soja*m/100:0;exp=soja?soja-ace-mer:0;}
  return {soja,ace,exp,mer,real};}
function despDia(f){return Object.entries(D.despachos||{}).filter(([,d])=>d&&d.fecha===f).map(([id,d])=>Object.assign({id},d)).sort((a,b)=>(a.horaSalida||'').localeCompare(b.horaSalida||''));}
function parDia(f){return Object.entries(D.paradas[f]||{}).map(([id,p])=>Object.assign({id},p)).sort((a,b)=>(a.ts||0)-(b.ts||0));}
function muestrasArr(){return Object.entries(D.muestras||{}).map(([id,m])=>Object.assign({id},m)).sort((a,b)=>(b.ts||0)-(a.ts||0));}
function muesDia(f){return muestrasArr().filter(m=>m.fecha===f);}
function dayStats(f){const T=D.turnos[f]||{};const r={soja:0,ace:0,exp:0,mer:0,real:false};
  TURNOS.forEach(([k])=>{if(T[k]){const c=tCalc(T[k]);r.soja+=c.soja;r.ace+=c.ace;r.exp+=c.exp;r.mer+=c.mer;if(c.real)r.real=true;}});
  const ds=despDia(f);r.despN=ds.length;r.despKg=ds.reduce((a,d)=>a+(d.neto||0),0);
  const ps=parDia(f).filter(p=>p.desde);r.parN=ps.length;r.parMin=ps.reduce((a,p)=>a+minutos(p.desde,p.hasta),0);
  r.mues=muesDia(f).length;return r;}
function fechasMes(ym,hasta){const s=new Set();Object.keys(D.turnos||{}).forEach(f=>{if(f.startsWith(ym))s.add(f);});Object.values(D.despachos||{}).forEach(d=>{if(d&&d.fecha&&d.fecha.startsWith(ym))s.add(d.fecha);});Object.keys(D.paradas||{}).forEach(f=>{if(f.startsWith(ym))s.add(f);});return [...s].filter(f=>!hasta||f<=hasta).sort();}
function sumStats(fechas){const r={soja:0,ace:0,exp:0,mer:0,despN:0,despKg:0,parN:0,parMin:0,mues:0,real:false};fechas.forEach(f=>{const d=dayStats(f);Object.keys(r).forEach(k=>{if(k==='real'){if(d.real)r.real=true;}else r[k]+=d[k];});});return r;}
function stockAceite(){const c=cfg();const desde=c.stockDesde||'0000-00-00';let s=Number(c.stockInicial)||0;
  Object.entries(D.turnos||{}).forEach(([f,T])=>{if(f>=desde)TURNOS.forEach(([k])=>{if(T[k]&&T[k].aceite)s+=T[k].aceite.kg||0;});});
  Object.values(D.despachos||{}).forEach(d=>{if(d&&(d.fecha||'')>=desde)s-=d.neto||0;});return s;}
function fechasConDatos(){const s=new Set(Object.keys(D.turnos||{}));Object.keys(D.paradas||{}).forEach(f=>s.add(f));Object.values(D.despachos||{}).forEach(d=>d&&d.fecha&&s.add(d.fecha));Object.values(D.muestras||{}).forEach(m=>m&&m.fecha&&s.add(m.fecha));return s;}
function respTurno(f,t){const T=(D.turnos[f]||{})[t];return (T&&T.responsable)||'';}
function estadoMuestra(m){return m.estado||'pendiente';}

/* =========================================================
   PIEZAS DE INTERFAZ
   ========================================================= */
function cv(h){return '--c:'+C[h][0]+';--t:'+C[h][1]+';--tt:'+C[h][2];}
function kp(ic,h,v,l,pc){return '<div class="kp" style="background:'+C[h][1]+';color:'+C[h][2]+';border-color:'+C[h][0]+'">'+(pc?'<span class="pc" style="background:'+C[h][0]+'">'+pc+'</span>':'')+'<i class="ti ti-'+ic+'" aria-hidden="true"></i><span class="v">'+v+'</span><span class="l">'+l+'</span></div>';}
function st(id,ic,h,n,s,bd){return '<div class="cc st '+(S.sub===id?'sel':'')+'" role="button" tabindex="0" data-u="'+id+'" style="'+cv(h)+'">'+(bd?'<span class="bdg">'+bd+'</span>':'')+'<i class="ti ti-'+ic+'" aria-hidden="true"></i><div><b>'+n+'</b><span>'+s+'</span></div></div>';}
function sec(h,ic,t,c){return '<div class="sec"><h3 style="color:'+C[h][0]+'"><i class="ti ti-'+ic+'" aria-hidden="true"></i>'+t+'</h3><div class="g">'+c+'</div></div>';}
function inp(l,id,ph,extra){return '<div><span class="lb">'+l+'</span><input id="'+id+'" placeholder="'+esc(ph||'')+'" '+(extra||'')+'></div>';}
function tanks(l){return '<span class="lb">'+l+'</span><div class="tk">'+['T1','T2','T3','TB'].map(t=>'<span class="cc '+(t===S.tq?'sel':'')+'" role="button" tabindex="0" data-t="'+t+'" style="'+cv('orange')+'">'+t+'</span>').join('')+'</div>';}
function box(lbl,h,v,s,stt){const c=stt==='ok'?C.green:stt==='cur'?C.yellow:C.gray;return '<div><div class="tl" style="color:'+c[0]+'">'+lbl+'<br><span style="font-weight:400;font-size:12px">'+h+'</span></div><div class="tb" style="background:'+c[1]+';color:'+c[2]+';border-color:'+c[0]+'"><span class="k">'+v+'</span><span class="s">'+s+'</span></div></div>';}
function totCard(h,titulo,r){const c=C[h];return '<div class="tot" style="border-color:'+c[0]+';background:'+c[1]+';color:'+c[2]+'"><b style="font-weight:600"><i class="ti ti-sum" aria-hidden="true"></i> '+titulo+'</b><div class="tg"><div>Soja procesada<b>'+fmt(r.soja)+' kg</b></div><div>Aceite producido<b>'+fmt(r.ace)+' kg</b></div><div>Expeller'+(r.real?'':' estimado')+'<b>'+fmt(r.exp)+' kg</b></div><div>Despachos<b>'+r.despN+' · '+fmt(r.despKg)+' kg</b></div></div></div>';}
function vacio(t){return '<div class="vacio">'+t+'</div>';}

function cal(){const y=S.vm.getFullYear(),m=S.vm.getMonth(),first=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate(),con=fechasConDatos(),h=hoy();
  let x='<div class="calw"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><button data-vm="-1" aria-label="Mes anterior"><i class="ti ti-chevron-left"></i></button><b style="font-weight:600;font-size:13px">'+cap(MS[m])+' '+y+'</b><button data-vm="1" aria-label="Mes siguiente"><i class="ti ti-chevron-right"></i></button></div><div class="cal">'+['D','L','M','M','J','V','S'].map(d=>'<span style="color:var(--tx2);font-size:11px">'+d+'</span>').join('');
  for(let i=0;i<first;i++)x+='<span></span>';
  for(let d=1;d<=n;d++){const f=y+'-'+p2(m+1)+'-'+p2(d);x+='<span class="d'+(f===S.sel?' s':'')+(con.has(f)?' h':'')+(f===h?' hoy':'')+'" data-day="'+f+'">'+d+'</span>';}
  return x+'</div><button class="sm" data-hoy="1" style="width:100%;margin-top:6px">Ir a hoy</button></div>';}
function hd(){const isDir=S.auth==='dir';let x='<div class="brand"><img src="'+LOGO+'" alt="Coopagro"><div><div class="t1">Aceitera Coopagro</div><div class="t2">Operativa de planta</div></div><button class="sm" data-out="1" style="margin-left:auto"><i class="ti ti-logout" aria-hidden="true"></i> Salir</button></div>';
  if(isDir)x+='<div class="g4">'+Object.values(SECT).map(r=>'<div class="cc nav '+(S.view===r[0]?'sel':'')+'" role="button" tabindex="0" data-r="'+r[0]+'" style="'+cv(r[2])+'"><i class="ti ti-'+r[1]+'" aria-hidden="true"></i>'+r[3]+'</div>').join('')+'</div>';
  x+='<div class="hd">'+(!S.locked?'<button data-home="1"><i class="ti ti-arrow-left" aria-hidden="true"></i> Inicio</button>':'')+'<span class="fecha '+(S.calOpen?'on':'')+'" role="button" tabindex="0" data-cal="1"><i class="ti ti-calendar" aria-hidden="true"></i> '+fd(S.sel)+(S.sel===hoy()?' · hoy':'')+' <i class="ti ti-chevron-'+(S.calOpen?'up':'down')+'" aria-hidden="true"></i></span>'+(S.calOpen?cal():'')+'</div>';
  return x;}

/* ---------- tarjetas de turno ---------- */
const DL=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
function diaLargo(f){return DL[parse(f).getDay()]+' '+fdc(f);}
function boxT(f,k,h,op){const t=(D.turnos[f]||{})[k];const c=t?tCalc(t):null;const tiene=c&&(c.soja||c.ace);const esCur=f===op.fecha&&k===op.turno&&!D.cierres[f];
  const nom=t&&t.responsable?esc(t.responsable.split(' ')[0]):'—';let bg,bd,lc,tx;
  if(esCur){bg='#633806';bd='#412402';lc='#854F0B';tx='#fff';}else if(tiene){bg='#3B6D11';bd='#27500A';lc='#3B6D11';tx='#fff';}else{bg='#F1EFE8';bd='#5F5E5A';lc='#5F5E5A';tx='#444441';}
  const inner=tiene?'<span class="k">Soja '+fmt(c.soja)+' kg</span><span class="x">Expeller '+fmt(c.exp)+'</span><span class="x" style="color:#FAC775">Aceite '+fmt(c.ace)+(t.aceite&&t.aceite.tanque?' · '+esc(t.aceite.tanque):'')+'</span>':'<span class="k">—</span><span class="x" style="font-weight:400">'+(esCur?'en carga':(f<op.fecha?'sin carga':'pendiente'))+'</span>';
  return '<div><div class="tl" style="color:'+lc+'">Turno '+TN[k]+' · '+nom+'<br><span style="font-weight:400;font-size:12px">'+h+'</span></div><div class="tb" style="background:'+bg+';border-color:'+bd+';color:'+tx+'">'+inner+'</div></div>';}
function gridDia(f){const op=opNow();return '<div class="g3">'+TURNOS.map(([k,n,h])=>boxT(f,k,h,op)).join('')+'</div>';}
function totLinea(f){const r=dayStats(f);return '<div class="totl"><span>Total del día</span><span>Soja '+fmt(r.soja)+' · Expeller '+fmt(r.exp)+' · Aceite '+fmt(r.ace)+' kg</span></div>';}
function contactos(){return Object.entries(cfg().contactos||{}).map(([id,c])=>Object.assign({id},c)).filter(c=>c&&c.numero);}
function remitoNum(f){const n=(D.remitos||{})[f];return n?'N° '+String(n).padStart(4,'0'):'';}
function compHTML(f){const c=D.cierres[f]||{};return '<div class="comp"><div style="display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #3B6D11;padding-bottom:8px"><img src="'+LOGO+'" alt="Coopagro" style="height:40px"><div style="text-align:right;font-size:12px"><b style="font-size:15px">Aceitera Coopagro</b><br>Remito de expeller de soja<br><b style="font-size:14px">'+remitoNum(f)+'</b></div></div><div style="text-align:center;margin:18px 0 6px;font-size:14px">'+diaLargo(f)+'</div><div style="text-align:center;font-size:14px">Expeller de soja</div><div style="text-align:center;font-size:32px;font-weight:600;color:#27500A;margin:4px 0 14px">'+fmt(dayStats(f).exp)+' kg</div><div style="font-size:12px;display:flex;justify-content:space-between;border-top:1px solid #ddd;padding-top:8px"><span>Cerró el día: '+esc(c.responsable||'—')+'</span><span>Hora de cierre: '+esc(c.hora||'—')+'</span></div></div>';}
function textoComp(f){const c=D.cierres[f]||{};return 'Aceitera Coopagro – Remito de expeller de soja '+remitoNum(f)+' – '+diaLargo(f)+': Expeller de soja '+fmt(dayStats(f).exp)+' kg. Cerró: '+(c.responsable||'')+', '+(c.hora||'')+'.';}
function waLink(num,txt){let d=String(num).replace(/\D/g,'');if(d.startsWith('0'))d=d.slice(1);if(d.startsWith('549'));else if(d.startsWith('54'))d='549'+d.slice(2);else d='549'+d;return 'https://wa.me/'+d+'?text='+encodeURIComponent(txt);}
function compCard(f){if(!D.cierres[f])return '';const cs=contactos();return '<div class="cd" style="border:3px solid #0F6E56"><h3 style="color:#0F6E56"><i class="ti ti-file-certificate" aria-hidden="true"></i> Remito de expeller de soja para Balanceados</h3>'+compHTML(f)+(cs.length?cs.map(c=>'<button class="wa" data-act="wa" data-n="'+esc(c.numero)+'" data-f="'+f+'"><span><i class="ti ti-brand-whatsapp" aria-hidden="true"></i> Enviar por WhatsApp a '+esc(c.nombre)+'</span><span style="font-size:13px">'+esc(c.numero)+'</span></button>').join(''):'<div class="hint">No hay contactos cargados. Se agregan en Dirección → Configuración.</div>')+'<button style="width:100%;margin-top:8px" data-act="printComp" data-f="'+f+'"><i class="ti ti-printer" aria-hidden="true"></i> Imprimir / PDF</button></div>';}
function cerradoInfo(f){const c=D.cierres[f];return c?'<div class="cerrado"><span><i class="ti ti-lock" aria-hidden="true"></i> Día cerrado a las '+esc(c.hora)+' por '+esc(c.responsable)+'.</span></div>':'';}

/* ---------- bloques compartidos ---------- */
function kpis(f){const r=dayStats(f);return '<div class="g" style="margin-bottom:12px">'+kp('plant-2','green',fmt(r.soja)+' kg','Soja procesada',r.soja?'100 %':'')+kp('droplet','orange',fmt(r.ace)+' kg','Aceite producido',r.soja?pct(r.ace,r.soja):'')+kp('box','violet',fmt(r.exp)+' kg',r.real?'Expeller producido':'Expeller estimado',r.soja?pct(r.exp,r.soja):'')+kp('percentage','aqua',fmt(r.mer)+' kg',r.real?'Merma real':'Merma estimada',r.soja?pct(r.mer,r.soja):'')+kp('database','blue',fmt(stockAceite())+' kg','Stock aceite')+'</div>';}
function porTurno(f){const T=D.turnos[f]||{};
  const ps=parDia(f);const obs=TURNOS.filter(([k])=>T[k]&&T[k].obs).map(([k])=>'<div style="font-size:13px;color:var(--tx2);margin-top:4px"><i class="ti ti-notes" aria-hidden="true"></i> Obs. turno '+TN[k]+': '+esc(T[k].obs)+'</div>').join('');
  return '<div class="cd"><h3><i class="ti ti-clock" aria-hidden="true"></i> Producción por turno · '+fd(f)+'</h3>'+cerradoInfo(f)+gridDia(f)+totLinea(f)+ps.map(p=>'<div style="font-size:13px;color:var(--tx2);margin-top:8px"><i class="ti ti-tool" aria-hidden="true"></i> Parada turno '+TN[p.turno]+' '+esc(p.desde)+' a '+esc(p.hasta)+' · '+esc(p.motivo)+(p.obs?' · '+esc(p.obs):'')+'</div>').join('')+obs+'</div>';}
function despRows(list,canDel){if(!list.length)return vacio('No hay despachos cargados este día.');return list.map(d=>'<div class="row"><span><span class="pill '+(d.negocio==='Negocio 2'?'pe':'pa')+'">'+esc(d.negocio)+'</span> <b>'+esc(d.empresa)+'</b><br><span style="color:var(--tx2);font-size:13px">'+[d.muestraNum,d.tanque,d.chofer,d.dni,d.patente+(d.acoplado?' / '+d.acoplado:''),d.intermediario?'Int. '+d.intermediario:'',d.horaIngreso?'ingresó '+d.horaIngreso:'','salió '+d.horaSalida,'Bruto '+fmt(d.bruto),'Tara '+fmt(d.tara)].filter(Boolean).map(esc).join(' · ')+'</span></span><span style="text-align:right;white-space:nowrap"><b>'+fmt(d.neto)+' kg</b>'+(canDel?'<br><button class="sm danger" data-act="delDesp" data-id="'+d.id+'" style="margin-top:4px">Eliminar</button>':'')+'</span></div>').join('')+'<div class="row" style="font-weight:600"><span>Total despachado</span><span>'+fmt(list.reduce((a,d)=>a+(d.neto||0),0))+' kg</span></div>';}
function despCard(f,canDel){return '<div class="cd"><h3><i class="ti ti-truck" aria-hidden="true"></i> Despachos de aceite · '+fd(f)+'</h3>'+despRows(despDia(f),canDel)+'</div>';}
function alerta(f,txt){const ds=despDia(f);if(!ds.length)return '<div class="alerta nada"><span><i class="ti ti-truck" aria-hidden="true"></i> Sin despachos de aceite '+txt+'</span></div>';return '<div class="alerta"><span><i class="ti ti-truck" style="font-size:18px" aria-hidden="true"></i> <b>'+ds.length+' despacho'+(ds.length>1?'s':'')+' de aceite '+txt+'</b> · '+fmt(ds.reduce((a,d)=>a+(d.neto||0),0))+' kg</span><button class="ob" data-u="de" data-f="'+f+'">Ver despachos <i class="ti ti-arrow-right" aria-hidden="true"></i></button></div>';}
function resultadoCard(m){const c=estadoMuestra(m)==='completa'?C.green:estadoMuestra(m)==='parcial'?C.blue:C.yellow;const r=m.resultados||{};const vals=CAMPOS[m.tipo].map(([k,n])=>'<span>'+n+' '+(r[k]!=null?fdec(r[k])+' %':'—')+'</span>').join('');
  return '<div style="border:2px solid '+c[0]+';background:'+c[1]+';color:'+c[2]+';border-radius:10px;padding:8px 12px;margin-top:8px"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><b>'+esc(m.numero)+'</b><span style="font-size:13px">'+cap(TIPO_N[m.tipo])+(m.patente?' · '+esc(m.patente):'')+' · '+fd(m.fecha)+' '+esc(m.hora||'')+' · <span class="pill '+(estadoMuestra(m)==='completa'?'ok':estadoMuestra(m)==='parcial'?'pa':'pe')+'">'+cap(estadoMuestra(m))+'</span></span></div><div class="res">'+vals+'</div>'+(m.obsLab?'<div style="font-size:13px;margin-top:4px">Obs. laboratorio: '+esc(m.obsLab)+'</div>':'')+(m.obs?'<div style="font-size:13px;margin-top:2px">Obs. planta: '+esc(m.obs)+'</div>':'')+'</div>';}

/* =========================================================
   RESUMEN MENSUAL
   ========================================================= */
function mesesOpts(sel){const n=new Date();let o='';for(let i=0;i<18;i++){const d=new Date(n.getFullYear(),n.getMonth()-i,1);const ym=d.getFullYear()+'-'+p2(d.getMonth()+1);o+='<option value="'+ym+'"'+(ym===sel?' selected':'')+'>'+cap(mesNombre(ym))+(i===0?' (en curso)':'')+'</option>';}return o;}
function mesDefault(){const n=new Date();const d=new Date(n.getFullYear(),n.getMonth()-1,1);return d.getFullYear()+'-'+p2(d.getMonth()+1);}
function datosMes(ym){const fs=fechasMes(ym);const r=sumStats(fs);const neg={};Object.values(D.despachos||{}).forEach(d=>{if(d&&d.fecha&&d.fecha.startsWith(ym)){const k=d.negocio||'Sin negocio';neg[k]=neg[k]||{n:0,kg:0};neg[k].n++;neg[k].kg+=d.neto||0;}});
  const mu={soja:0,expeller:0,aceite:0};muestrasArr().forEach(m=>{if(m.fecha&&m.fecha.startsWith(ym)&&estadoMuestra(m)!=='pendiente')mu[m.tipo]=(mu[m.tipo]||0)+1;});
  return {fs,r,neg,mu};}

  h+='<h4>Despachos de aceite</h4><table><tr><th>Negocio</th><th>Camiones</th><th>Kg netos</th></tr>'+(negs.length?negs.map(k=>'<tr><td>'+esc(k)+'</td><td>'+neg[k].n+'</td><td>'+fmt(neg[k].kg)+'</td></tr>').join(''):'<tr><td colspan="3" style="text-align:center">Sin despachos</td></tr>')+'<tr><td><b>Total</b></td><td><b>'+r.despN+'</b></td><td><b>'+fmt(r.despKg)+'</b></td></tr></table>';
  const sx=sxInfo(ym);h+='<h4>Stock de expeller de soja al cierre del mes</h4><table><tr><th>Silo</th><th>Kg</th></tr><tr><td>Silo de planta</td><td>'+(sx?fmt(sx.planta):'—')+'</td></tr><tr><td>Silo de transbordo</td><td>'+(sx?fmt(sx.transbordo):'—')+'</td></tr><tr><td><b>Total</b></td><td><b>'+(sx?fmt(sx.total):'Sin cargar')+'</b></td></tr></table>'+(sx?'<div style="font-size:11px;margin-top:2px">Cargado por '+esc(sx.responsable||'')+' el '+fdc(sx.fecha)+' '+esc(sx.hora||'')+'</div>':'');
  h+='<h4>Paradas y muestras</h4><table><tr><td>Paradas por mantenimiento</td><td>'+r.parN+' · '+hm(r.parMin)+'</td></tr><tr><td>Muestras analizadas (soja / expeller / aceite)</td><td>'+mu.soja+' / '+mu.expeller+' / '+mu.aceite+'</td></tr></table>';
  h+='<h4>Detalle diario</h4><table><tr><th>Día</th><th>Soja</th><th>Aceite</th><th>%</th><th>Expeller</th><th>Despachado</th></tr>'+(fs.length?fs.map(f=>{const d=dayStats(f);return '<tr><td>'+fd(f)+'</td><td>'+fmt(d.soja)+'</td><td>'+fmt(d.ace)+'</td><td>'+pct(d.ace,d.soja)+'</td><td>'+fmt(d.exp)+'</td><td>'+fmt(d.despKg)+'</td></tr>';}).join(''):'<tr><td colspan="6" style="text-align:center">Sin datos cargados</td></tr>')+'</table>';
  h+='<div style="display:flex;justify-content:space-around;margin-top:40px"><div style="border-top:1px solid #333;width:40%;text-align:center;padding-top:3px">Firma responsable</div><div style="border-top:1px solid #333;width:40%;text-align:center;padding-top:3px">Aclaración</div></div>';
  return h;}
function textoMes(ym){const {r,neg}=datosMes(ym);let t='Aceitera Coopagro - Resumen mensual '+cap(mesNombre(ym))+'\n\nSoja procesada: '+fmt(r.soja)+' kg\nAceite producido: '+fmt(r.ace)+' kg ('+pct(r.ace,r.soja)+')\nExpeller'+(r.real?'':' estimado')+': '+fmt(r.exp)+' kg ('+pct(r.exp,r.soja)+')\nMerma: '+fmt(r.mer)+' kg ('+pct(r.mer,r.soja)+')\n\nDespachos de aceite: '+r.despN+' camiones, '+fmt(r.despKg)+' kg\n';Object.keys(neg).sort().forEach(k=>{t+='  '+k+': '+neg[k].n+' camiones, '+fmt(neg[k].kg)+' kg\n';});const sx=sxInfo(ym);t+='\nStock de expeller al cierre: '+(sx?'Silo de planta '+fmt(sx.planta)+' kg, Silo de transbordo '+fmt(sx.transbordo)+' kg, total '+fmt(sx.total)+' kg':'sin cargar')+'\n';t+='\nParadas: '+r.parN+' ('+hm(r.parMin)+')\n';return t;}
function resMensual(){const ym=S.mesRes||mesDefault();return '<div class="cd" style="border:3px solid #534AB7"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap"><h3 style="margin:0;color:#534AB7"><i class="ti ti-file-report" aria-hidden="true"></i> Resumen mensual</h3><select id="mesres" style="width:auto">'+mesesOpts(ym)+'</select></div>'+stockExpCard(ym)+'<div class="acc"><button data-act="print"><i class="ti ti-printer" aria-hidden="true"></i>Imprimir / PDF</button><button data-act="mail"><i class="ti ti-mail" aria-hidden="true"></i>Enviar por mail</button><button data-act="share"><i class="ti ti-share" aria-hidden="true"></i>Compartir</button></div><div class="hoja">'+hojaHTML(ym)+'</div></div>';}
function imprimir(){const ym=S.mesRes||mesDefault();const w=window.open('','_blank');if(!w){toast('El navegador bloqueó la ventana de impresión. Permití ventanas emergentes para esta página.',1);return;}

function enviarMail(){const ym=S.mesRes||mesDefault();location.href='mailto:?subject='+encodeURIComponent('Resumen mensual Aceitera Coopagro - '+cap(mesNombre(ym)))+'&body='+encodeURIComponent(textoMes(ym)+'\n(Para adjuntar la hoja firmada, usá Imprimir / PDF y guardala como PDF.)');}
function compartir(){const ym=S.mesRes||mesDefault();const t=textoMes(ym);if(navigator.share){navigator.share({title:'Resumen mensual Coopagro',text:t}).catch(()=>{});}else if(navigator.clipboard){navigator.clipboard.writeText(t).then(()=>toast('Resumen copiado: pegalo en WhatsApp o donde quieras'));}else toast('Este navegador no permite compartir. Usá Imprimir / PDF.',1);}

function labForm(id){const m=D.muestras[id];if(!m)return '';const r=m.resultados||{};return '<div class="cd" style="border:2px solid #3B6D11"><h3>Resultados '+esc(m.numero)+' · '+TIPO_N[m.tipo]+(m.patente?' · '+esc(m.patente):'')+'</h3><div class="g">'+CAMPOS[m.tipo].map(([k,n])=>inp(n+' %','r_'+k,'','inputmode="decimal" value="'+(r[k]!=null?String(r[k]).replace('.',','):'')+'"')).join('')+'</div><div style="margin-top:10px"><span class="lb">Observaciones</span><textarea id="robs" rows="2">'+esc(m.obsLab||'')+'</textarea></div><div class="hint">Podés guardar con algunos ensayos vacíos: la muestra queda como parcial y la completás después.</div><button class="go" data-act="res" data-id="'+id+'"><i class="ti ti-device-floppy" aria-hidden="true"></i> Guardar resultados</button></div>';}

  if(S.sub==='lm'){const all=muestrasArr();const pend=all.filter(m=>estadoMuestra(m)!=='completa');const compl=all.filter(m=>estadoMuestra(m)==='completa'&&m.fecha===S.sel);
    const card=m=>{const e=estadoMuestra(m);const h=e==='completa'?'green':e==='parcial'?'blue':'yellow';return '<div class="cc st '+(S.lsel===m.id?'sel':'')+'" role="button" tabindex="0" data-ls="'+m.id+'" style="'+cv(h)+';justify-content:space-between"><div><b>'+esc(m.numero)+'</b><span>'+cap(TIPO_N[m.tipo])+(m.patente?' · '+esc(m.patente):'')+' · '+fd(m.fecha)+' '+esc(m.hora||'')+'</span></div><span class="pill '+(e==='completa'?'ok':e==='parcial'?'pa':'pe')+'">'+cap(e)+'</span></div>';};
    b='<div class="g" style="margin-bottom:12px">'+kp('hourglass','yellow',all.filter(m=>estadoMuestra(m)==='pendiente').length,'Pendientes')+kp('progress','blue',all.filter(m=>estadoMuestra(m)==='parcial').length,'Parciales')+kp('circle-check','green',all.filter(m=>estadoMuestra(m)==='completa'&&m.fecha===S.sel).length,'Completas · '+fd(S.sel))+'</div>'
    +'<div class="sec"><h3 style="color:#854F0B"><i class="ti ti-hourglass" aria-hidden="true"></i>Por analizar</h3>'+(pend.length?'<div class="g">'+pend.map(card).join('')+'</div>':vacio('No hay muestras pendientes.'))+'</div>'+(S.lsel&&D.muestras[S.lsel]&&estadoMuestra(D.muestras[S.lsel])!=='completa'?labForm(S.lsel):'')
    +'<div class="sec"><h3 style="color:#3B6D11"><i class="ti ti-circle-check" aria-hidden="true"></i>Completas del '+fd(S.sel)+'</h3>'+(compl.length?'<div class="g">'+compl.map(card).join('')+'</div>':vacio('No hay muestras completas tomadas ese día.'))+'</div>'+(S.lsel&&D.muestras[S.lsel]&&estadoMuestra(D.muestras[S.lsel])==='completa'?labForm(S.lsel):'');}

function histRes(){const q=S.hq.toLowerCase();const l=muestrasArr().filter(m=>(!S.htipo||m.tipo===S.htipo)&&(!q||[m.numero,m.patente,m.chofer].some(x=>(x||'').toLowerCase().includes(q))));return l.length?l.slice(0,100).map(resultadoCard).join('')+(l.length>100?vacio('Se muestran las 100 más recientes. Afiná la búsqueda para ver otras.'):''):vacio('No se encontraron muestras.');}

function estadisticas(){const ym=S.mesEst||S.sel.slice(0,7);const fs=fechasMes(ym);const r=sumStats(fs);const max=Math.max(1,...fs.map(f=>dayStats(f).soja));

  +'<div class="g" style="margin-bottom:12px">'+kp('plant-2','green',fmt(r.soja)+' kg','Soja del mes','100 %')+kp('droplet','orange',fmt(r.ace)+' kg','Aceite',pct(r.ace,r.soja))+kp('box','violet',fmt(r.exp)+' kg','Expeller',pct(r.exp,r.soja))+kp('calendar','gray',fs.length?fmt(r.soja/fs.length)+' kg':'—','Promedio soja por día')+kp('tool','red',r.parN+'','Paradas · '+hm(r.parMin))+'</div>'
  +(fs.length?'<div class="scrollx"><table class="tbl"><tr><th>Día</th><th style="width:30%"></th><th>Soja</th><th>Aceite</th><th>Rend.</th><th>Expeller</th><th>Despachado</th></tr>'+fs.map(f=>{const d=dayStats(f);return '<tr><td>'+fd(f)+'</td><td><div class="barra" style="width:'+(d.soja/max*100)+'%"></div></td><td>'+fmt(d.soja)+'</td><td>'+fmt(d.ace)+'</td><td>'+pct(d.ace,d.soja)+'</td><td>'+fmt(d.exp)+'</td><td>'+fmt(d.despKg)+'</td></tr>';}).join('')+'</table></div>':vacio('No hay datos cargados en este mes.'))+'</div>';}
function corregir(){const f=S.sel;const T=D.turnos[f]||{};const ps=personal();

  +'<h3 style="margin-top:18px"><i class="ti ti-brand-whatsapp" aria-hidden="true"></i> Contactos para el comprobante de expeller</h3>'+(contactos().length?contactos().map(c=>'<div class="row"><span>'+esc(c.nombre)+' · '+esc(c.numero)+'</span><button class="sm danger" data-act="delCont" data-id="'+c.id+'">Quitar</button></div>').join(''):vacio('No hay contactos cargados.'))
  +'<div class="g" style="margin-top:8px;align-items:end">'+inp('Nombre','cnom','Jefe de balanceados')+inp('Número con código de área','cnum','249 4xxxxxx','inputmode="tel"')+'<div><button data-act="addCont" style="width:100%"><i class="ti ti-plus" aria-hidden="true"></i> Agregar contacto</button></div></div></div>';}
function adm(){let b='';if(S.sub==='dd')b=despCard(S.sel,true);if(S.sub==='d1')b=estadisticas();if(S.sub==='d2')b=corregir();if(S.sub==='d3')b=personalCard();if(S.sub==='qm')b=resMensual();

function draw(){S.dirty=false;S.pend=false;const scr=el('scr');let h;
  if(!D.config)h='<div class="vacio">Conectando…</div>';
  else if(S.login)h=loginView();
  else if(!S.auth)h=home();
  else h=({pl:planta,lab:lab,fin:fin,adm:adm})[S.view]();
  scr.innerHTML=h;
  if(S.login){const c=el('clave');if(c)c.focus();}}
function renderSafe(){if(S.dirty){S.pend=true;return;}draw();}
function entrar(sector){S.auth=sector;S.login=null;S.view=SECT[sector][0];S.sub=DEF_SUB[S.view];S.sel=hoy();S.vm=parse(S.sel);S.calOpen=false;draw();}
function salir(){if(S.auth)lsDel('opc_auth_'+S.auth);S.auth=null;S.sub=null;S.login=S.locked||null;draw();}
function intentarAuto(){if(S.auth||!D.config)return;const k=claves();const s=S.locked;if(s&&lsGet('opc_auth_'+s)===k[s]){entrar(s);return;}}

   ========================================================= */
function guardarLectura(prod){if(D.cierres[opNow().fecha]){toast('El día ya está cerrado',1);return;}const v=numIn('lec');if(v==null){toast('Ingresá la lectura de la balanza',1);return;}
  const op=opNow();const resp=respTurno(op.fecha,op.turno);if(!resp){toast('Primero elegí el responsable del turno (arriba)',1);return;}
  const b=baseLectura(prod);let data;
  if(b.base==null){if(!confirm('Es la primera lectura de '+TIPO_N[prod]+'. Se toma como punto de partida y este turno queda en 0 kg. ¿Continuar?'))return;data={base:v,kgFijo:0,lectura:v,primera:true};}
  else if(v<b.base){S.reset={prod,v};draw();return;}
  else data={base:b.base,kgFijo:b.kgFijo,lectura:v};
  if(b.rec&&b.rec.reinicio)data.reinicio=true;
  data.kg=data.kgFijo+data.lectura-data.base;
  escribirLectura(prod,op,data,resp);}
function escribirLectura(prod,op,data,resp){if(prod==='aceite')data.tanque=S.tq;data.ts=Date.now();const p='turnos/'+op.fecha+'/'+op.turno;const up={};up[p+'/'+prod]=data;up[p+'/responsable']=resp;if(prod==='soja')up[p+'/merma']=mermaCfg();up['ultima/'+prod]={lectura:data.lectura,fecha:op.fecha,turno:op.turno};
  db.ref(ROOT).update(up).then(()=>{S.reset=null;toast('Guardado: '+fmt(data.kg)+' kg en el turno '+TN[op.turno]);draw();}).catch(errFb);}
function confirmarReinicio(prod){const kg=numIn('rkg'),L=numIn('rlec');if(kg==null||L==null){toast('Completá los kg del turno (puede ser 0) y la lectura actual',1);return;}const op=opNow();const resp=respTurno(op.fecha,op.turno);if(!resp){toast('Primero elegí el responsable del turno',1);return;}
  escribirLectura(prod,op,{base:L,kgFijo:kg,lectura:L,kg:kg,reinicio:true},resp);}
function guardarParada(){const d=val('pdesde'),h=val('phasta'),m=val('pmot');if(!d||!h||!m){toast('Completá desde, hasta y motivo de la parada',1);return;}const op=opNow();
  db.ref(ROOT+'/paradas/'+op.fecha).push({desde:d,hasta:h,motivo:m,obs:val('pobs'),turno:op.turno,responsable:respTurno(op.fecha,op.turno),ts:Date.now()}).then(()=>{toast('Parada guardada');draw();}).catch(errFb);}
function guardarObs(){const op=opNow();db.ref(ROOT+'/turnos/'+op.fecha+'/'+op.turno+'/obs').set(val('tobs')).then(()=>{toast('Observaciones guardadas');draw();}).catch(errFb);}
function guardarMuestra(tipo){const op=opNow();const pref=PREF[tipo];const data={tipo,fecha:op.fecha,turno:op.turno,hora:hhmm(new Date()),obs:val('mobs'),ts:Date.now(),estado:'pendiente',responsable:respTurno(op.fecha,op.turno)};
  if(tipo!=='expeller'){data.patente=val('mpat').toUpperCase().replace(/\s/g,'');data.chofer=val('mcho');if(!data.patente){toast('Completá la patente del camión',1);return;}}
  db.ref(ROOT+'/config/contadores/'+pref).transaction(n=>(n||0)+1).then(r=>{if(!r.committed)throw new Error('contador');data.numero=pref+String(r.snapshot.val()).padStart(4,'0');return db.ref(ROOT+'/muestras').push(data);}).then(()=>{toast('Muestra '+data.numero+' enviada a laboratorio');S.nm=null;draw();}).catch(errFb);}
function guardarResultados(id){const m=D.muestras[id];if(!m)return;const res={};let n=0;CAMPOS[m.tipo].forEach(([k])=>{const v=decIn('r_'+k);if(v!=null){res[k]=v;n++;}});const estado=n===0?'pendiente':(n<CAMPOS[m.tipo].length?'parcial':'completa');
  db.ref(ROOT+'/muestras/'+id).update({resultados:res,obsLab:val('robs'),estado,tsLab:Date.now()}).then(()=>{toast('Resultados de '+m.numero+' guardados ('+estado+')');S.lsel=null;draw();}).catch(errFb);}
function guardarDespacho(){const tara=numIn('tara'),bruto=numIn('bruto');const d={fecha:val('dfecha')||opNow().fecha,negocio:val('dneg'),empresa:val('demp'),intermediario:val('dint'),chofer:val('dcho'),dni:val('ddni'),patente:val('dpat').toUpperCase().replace(/\s/g,''),acoplado:val('dacop').toUpperCase().replace(/\s/g,''),horaIngreso:val('dhin'),horaSalida:val('dhout'),tanque:S.tq,ts:Date.now()};
  const falta=[];if(!d.empresa)falta.push('empresa de destino');if(!d.chofer)falta.push('chofer');if(!d.patente)falta.push('patente');if(!d.horaSalida)falta.push('hora de salida');if(tara==null)falta.push('tara');if(bruto==null)falta.push('bruto');
  if(falta.length){toast('Falta completar: '+falta.join(', '),1);return;}if(bruto<=tara){toast('El bruto tiene que ser mayor que la tara',1);return;}
  d.tara=tara;d.bruto=bruto;d.neto=bruto-tara;d.turno=turnoDeHora(d.horaSalida);d.responsable=respTurno(opNow().fecha,opNow().turno);const mid=val('dmue');if(mid&&D.muestras[mid]){d.muestraId=mid;d.muestraNum=D.muestras[mid].numero;}
  const key=db.ref(ROOT+'/despachos').push().key;const up={};up['despachos/'+key]=d;if(d.muestraId)up['muestras/'+d.muestraId+'/despachoId']=key;
  db.ref(ROOT).update(up).then(()=>{toast('Despacho registrado: '+fmt(d.neto)+' kg netos');S.sub='ver';draw();}).catch(errFb);}
function corregirTurno(k){const f=S.sel;const T=(D.turnos[f]||{})[k]||{};const up={};const p='turnos/'+f+'/'+k;
  up[p+'/responsable']=val('c_'+k+'_resp')||null;
  ['soja','aceite','expeller'].forEach(x=>{if(!el('c_'+k+'_'+x))return;const v=numIn('c_'+k+'_'+x);if(v==null){if(T[x])up[p+'/'+x]=null;return;}const r=T[x]||{};const base=r.base!=null?r.base:0,lec=r.lectura!=null?r.lectura:0;
    up[p+'/'+x]=Object.assign({},r,{kg:v,kgFijo:v-(lec-base),base,lectura:lec,editado:true,ts:Date.now()});});
  const m=decIn('c_'+k+'_merma');up[p+'/merma']=m;
  db.ref(ROOT).update(up).then(()=>{toast('Turno '+TN[k]+' corregido');draw();}).catch(errFb);}
function borrarDespacho(id){const d=D.despachos[id];if(!d||!confirm('¿Eliminar el despacho de '+d.empresa+' ('+fmt(d.neto)+' kg)?'))return;const up={};up['despachos/'+id]=null;if(d.muestraId&&D.muestras[d.muestraId])up['muestras/'+d.muestraId+'/despachoId']=null;db.ref(ROOT).update(up).then(()=>toast('Despacho eliminado')).catch(errFb);}
function borrarParada(id){if(!confirm('¿Eliminar esta parada?'))return;db.ref(ROOT+'/paradas/'+S.sel+'/'+id).remove().then(()=>toast('Parada eliminada')).catch(errFb);}
function borrarMuestra(id){const m=D.muestras[id];if(!m||!confirm('¿Eliminar la muestra '+m.numero+'?'))return;db.ref(ROOT+'/muestras/'+id).remove().then(()=>toast('Muestra eliminada')).catch(errFb);}
function guardarStockExp(){const pl=numIn('sxpl'),tr=numIn('sxtr');if(pl==null||tr==null){toast('Completá los kg de los dos silos (puede ser 0)',1);return;}const op=opNow();const resp=respTurno(op.fecha,op.turno);if(!resp){toast('Primero elegí el responsable del turno (arriba)',1);return;}const ym=val('sxmes')||op.fecha.slice(0,7);
  db.ref(ROOT+'/stockExp/'+ym).set({planta:pl,transbordo:tr,total:pl+tr,responsable:resp,fecha:op.fecha,hora:hhmm(new Date()),ts:Date.now()}).then(()=>{toast('Stock de expeller de '+mesNombre(ym)+' guardado: '+fmt(pl+tr)+' kg');draw();}).catch(errFb);}
function cerrarDia(){const op=opNow();const resp=respTurno(op.fecha,op.turno);if(!resp){toast('Primero elegí el responsable del turno (arriba)',1);return;}
  const f=op.fecha;const existente=(D.remitos||{})[f];
  const num=existente?Promise.resolve(existente):db.ref(ROOT+'/config/contadores/R').transaction(n=>(n||0)+1).then(r=>{if(!r.committed)throw new Error('contador');return r.snapshot.val();});
  num.then(n=>{const up={};up['remitos/'+f]=n;up['cierres/'+f]={hora:hhmm(new Date()),responsable:resp,ts:Date.now(),expeller:Math.round(dayStats(f).exp),remito:n};return db.ref(ROOT).update(up);}).then(()=>{S.finConf=false;toast('Día cerrado. El remito está listo para enviar');draw();}).catch(errFb);}
function imprimirComp(f){const w=window.open('','_blank');if(!w){toast('El navegador bloqueó la ventana de impresión. Permití ventanas emergentes para esta página.',1);return;}
  w.document.write('<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><title>Remito expeller '+remitoNum(f)+' '+fdc(f)+'</title><style>body{margin:24px;font-family:Georgia,serif}.comp{max-width:520px;margin:0 auto;border:1px solid #ccc;padding:18px 20px}</style></head><body>'+compHTML(f)+'<script>window.onload=function(){setTimeout(function(){window.print();},300);}<\/script></body></html>');w.document.close();}
function agregarContacto(){const n=val('cnom'),t=val('cnum');if(!n||!t){toast('Completá nombre y número',1);return;}if(t.replace(/\D/g,'').length<10){toast('El número tiene que llevar código de área (ej. 249 4308969)',1);return;}db.ref(ROOT+'/config/contactos').push({nombre:n,numero:t}).then(()=>{toast('Contacto agregado');draw();}).catch(errFb);}
function guardarConfig(){const k={planta:val('ck_planta'),lab:val('ck_lab'),admin:val('ck_admin'),dir:val('ck_dir')};if(Object.values(k).some(x=>!x)){toast('Ninguna clave puede quedar vacía',1);return;}
  const m=decIn('cmer');const up={claves:k,merma:m==null?0:m,stockInicial:numIn('cstock')||0,stockDesde:val('cstockd')||null};
  db.ref(ROOT+'/config').update(up).then(()=>{lsSet('opc_auth_dir',k.dir);toast('Configuración guardada');draw();}).catch(errFb);}

/* =========================================================
   EVENTOS
   ========================================================= */
const NO_DIRTY=['hq','htipo','mesres','mesest','resp','dmue','clave','sxmes'];
document.addEventListener('input',e=>{const id=e.target.id;
  if(!NO_DIRTY.includes(id))S.dirty=true;
  if(id==='lec'){const i=el('lecinfo');const v=numIn('lec');if(i&&i.dataset.base!==''&&v!=null){const base=Number(i.dataset.base),fijo=Number(i.dataset.fijo);i.textContent=v<base?'Ojo: la lectura es menor que la anterior ('+fmt(base)+'). Al guardar te va a pedir los datos del reinicio.':'Este turno: '+fmt(fijo+v-base)+' kg';i.style.color=v<base?'#A32D2D':'#3B6D11';}}
  if(id==='tara'||id==='bruto'){const t=numIn('tara'),b=numIn('bruto'),n=el('neto');if(n){if(t!=null&&b!=null){n.textContent=fmt(b-t);n.style.color=b-t<=0?'#A32D2D':'';}else n.textContent='—';}}
  if(id==='sxpl'||id==='sxtr'){const a=numIn('sxpl'),b=numIn('sxtr'),t=el('sxtot');if(t)t.textContent=(a==null&&b==null)?'—':fmt((a||0)+(b||0));}
  if(id==='hq'){S.hq=e.target.value;const r=el('hres');if(r)r.innerHTML=histRes();}});
document.addEventListener('change',e=>{const id=e.target.id;
  if(id==='resp'){const op=opNow();const v=e.target.value;db.ref(ROOT+'/turnos/'+op.fecha+'/'+op.turno+'/responsable').set(v||null).then(()=>toast(v?'Responsable del turno: '+v:'Responsable quitado')).catch(errFb);}
  if(id==='htipo'){S.htipo=e.target.value;const r=el('hres');if(r)r.innerHTML=histRes();}
  if(id==='mesres'){S.mesRes=e.target.value;draw();}
  if(id==='mesest'){S.mesEst=e.target.value;draw();}
  if(id==='sxmes'){S.sxMes=e.target.value;draw();}
  if(id==='dmue'){const m=D.muestras[e.target.value];const set=(i,v)=>{const x=el(i);if(x){x.value=v||'';x.classList.toggle('auto',!!v);}};
    set('dpat',m&&m.patente);set('dcho',m&&m.chofer);
    if(m){const prev=Object.values(D.despachos||{}).filter(d=>d&&d.patente===m.patente).sort((a,b)=>(b.ts||0)-(a.ts||0))[0];const prevC=Object.values(D.despachos||{}).filter(d=>d&&d.chofer===m.chofer).sort((a,b)=>(b.ts||0)-(a.ts||0))[0];if(prev&&prev.acoplado)set('dacop',prev.acoplado);if(prevC&&prevC.dni)set('ddni',prevC.dni);}}
  if(id==='dcho'){const v=e.target.value;const prev=Object.values(D.despachos||{}).filter(d=>d&&d.chofer===v).sort((a,b)=>(b.ts||0)-(a.ts||0))[0];const x=el('ddni');if(prev&&prev.dni&&x&&!x.value){x.value=prev.dni;x.classList.add('auto');}}
  if(id==='dpat'){const v=e.target.value.toUpperCase().replace(/\s/g,'');const prev=Object.values(D.despachos||{}).filter(d=>d&&d.patente===v).sort((a,b)=>(b.ts||0)-(a.ts||0))[0];const x=el('dacop');if(prev&&prev.acoplado&&x&&!x.value){x.value=prev.acoplado;x.classList.add('auto');}}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='clave'){e.preventDefault();accion('login');return;}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('[role="button"],[role="switch"]')){e.preventDefault();e.target.click();}});
function accion(a,x){switch(a){
  case 'login':{const k=claves();if(val('clave')===k[S.login]){lsSet('opc_auth_'+S.login,k[S.login]);entrar(S.login);}else toast('Clave incorrecta',1);break;}
  case 'lec':guardarLectura(x.dataset.p);break;
  case 'rconf':confirmarReinicio(x.dataset.p);break;
  case 'rcanc':S.reset=null;draw();break;
  case 'par':guardarParada();break;
  case 'obs':guardarObs();break;
  case 'mue':guardarMuestra(x.dataset.p);break;
  case 'res':guardarResultados(x.dataset.id);break;
  case 'desp':guardarDespacho();break;
  case 'fixT':corregirTurno(x.dataset.k);break;
  case 'delDesp':borrarDespacho(x.dataset.id);break;
  case 'delPar':borrarParada(x.dataset.id);break;
  case 'delMue':borrarMuestra(x.dataset.id);break;
  case 'cfg':guardarConfig();break;
  case 'sx':guardarStockExp();break;
  case 'finAsk':S.finConf=true;draw();break;
  case 'finNo':S.finConf=false;draw();break;
  case 'finOk':cerrarDia();break;
  case 'reabrir':if(confirm('¿Reabrir el día '+fd(S.sel)+'? Se van a poder volver a cargar lecturas.'))db.ref(ROOT+'/cierres/'+S.sel).remove().then(()=>toast('Día reabierto')).catch(errFb);break;
  case 'wa':window.open(waLink(x.dataset.n,textoComp(x.dataset.f)),'_blank');break;
  case 'printComp':imprimirComp(x.dataset.f);break;
  case 'addCont':agregarContacto();break;
  case 'delCont':if(confirm('¿Quitar este contacto?'))db.ref(ROOT+'/config/contactos/'+x.dataset.id).remove().catch(errFb);break;
  case 'bal':db.ref(ROOT+'/config/balanzaExpeller').set(!balExp()).catch(errFb);break;
  case 'print':imprimir();break;
  case 'mail':enviarMail();break;
  case 'share':compartir();break;}}
document.addEventListener('click',e=>{const q=s=>e.target.closest(s);let x;
  if(S.calOpen&&!q('.calw')&&!q('[data-cal]')){S.calOpen=false;draw();return;}
  if(x=q('[data-act]')){accion(x.dataset.act,x);return;}
  if(x=q('[data-login]')){S.login=x.dataset.login;draw();return;}
  if(x=q('[data-r]')){S.view=x.dataset.r;S.sub=DEF_SUB[S.view];S.nm=null;S.lsel=null;S.reset=null;S.finConf=false;draw();return;}
  if(q('[data-home]')){S.auth=null;S.login=null;S.sub=null;draw();return;}
  if(q('[data-out]')){salir();return;}
  if(q('[data-cal]')){S.calOpen=!S.calOpen;S.vm=parse(S.sel);S.vm.setDate(1);draw();return;}
  if(x=q('[data-vm]')){S.vm=new Date(S.vm.getFullYear(),S.vm.getMonth()+Number(x.dataset.vm),1);draw();return;}
  if(x=q('[data-day]')){S.sel=x.dataset.day;S.calOpen=false;S.lsel=null;draw();return;}
  if(q('[data-hoy]')){S.sel=hoy();S.calOpen=false;draw();return;}
  if(x=q('[data-nm]')){S.nm=x.dataset.nm;draw();return;}
  if(q('[data-nmc]')){S.nm=null;draw();return;}
  if(x=q('[data-ls]')){S.lsel=S.lsel===x.dataset.ls?null:x.dataset.ls;draw();return;}
  if(x=q('[data-u]')){const u=x.dataset.u;if(x.dataset.f)S.sel=x.dataset.f;if(S.view==='fin'||S.view==='lab')S.sub=u;else S.sub=S.sub===u?null:u;S.nm=null;S.lsel=null;S.reset=null;S.finConf=false;draw();return;}
  if(x=q('[data-t]')){S.tq=x.dataset.t;document.querySelectorAll('[data-t]').forEach(t=>t.classList.toggle('sel',t.dataset.t===S.tq));return;}});

/* =========================================================
   CONEXIÓN CON FIREBASE
   ========================================================= */
(function init(){const s=new URLSearchParams(location.search).get('s');if(s&&SECT[s]){S.locked=s;S.login=s;}
  S.sel=hoy();S.vm=parse(S.sel);
  db.ref(ROOT+'/config').on('value',sn=>{const first=!D.config;D.config=sn.val()||{};if(first&&!D.config.contactosInit){db.ref(ROOT+'/config').update({contactosInit:true,'contactos/c1':{nombre:'Balanceados',numero:'249 4308969'}}).catch(()=>{});}if(first){if(S.locked&&lsGet('opc_auth_'+S.locked)===claves()[S.locked]){entrar(S.locked);return;}draw();}else renderSafe();},e=>{console.error(e);el('scr').innerHTML='<div class="aviso">No se pudo conectar con la base de datos. Revisá la conexión a internet y recargá la página.</div>';});
  [['remitos','remitos'],['stockExp','stockExp'],['cierres','cierres'],['turnos','turnos'],['paradas','paradas'],['despachos','despachos'],['muestras','muestras'],['ultima','ultima']].forEach(([k,p])=>{db.ref(ROOT+'/'+p).on('value',sn=>{D[k]=sn.val()||{};if(D.config)renderSafe();});});
  db.ref(ROOT_PERSONAL).on('value',sn=>{D.personal=sn.val()||{};if(D.config)renderSafe();});
  setInterval(()=>{if(S.auth&&!S.calOpen)renderSafe();},60000);
  document.addEventListener('focusout',()=>{setTimeout(()=>{if(S.pend&&!S.dirty)draw();},0);});})();
</script>
